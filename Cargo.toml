[package]
name = "attestation-verifier"
version = "0.1.0"
# Explicit, not edition.workspace = true: that inheritance only resolves
# inside this repo's own workspace root. Left explicit so the manifest is
# still valid on its own once this directory is extracted/published
# standalone (see the license comment below for the same reasoning).
edition = "2021"
# Deliberately NOT license.workspace = true: the rest of this workspace is
# "Proprietary" (see root Cargo.toml), but the whole point of this crate is
# that anyone -- another MPC party, a design partner, an auditor -- can
# compile and run it themselves without needing Velocity's permission or
# access to the rest of this (private) repository. A proprietary license on
# the one crate meant to be freely rebuilt by third parties would be
# self-defeating. MIT OR Apache-2.0 matches the Rust ecosystem's own
# convention (and `cggmp21`'s own dual license).
license = "MIT OR Apache-2.0"
publish = false
description = "Independent, open-source attestation-verification engine and CLI for Velocity's TEE-backed nodes (Nitro + TDX/dstack). Adds no new cryptography -- see README.md."

[lib]
name = "attestation_verifier"
path = "src/lib.rs"

[[bin]]
name = "attestation-verifier"
path = "src/main.rs"

[dependencies]
thiserror = "1"
# Nitro: real COSE_Sign1 + AWS Nitro root CA chain verification (Evervault,
# MIT/Apache-2.0) and the real NSM device API.
attestation-doc-validation = { version = "0.10", optional = true }
aws-nitro-enclaves-nsm-api = { version = "0.4", optional = true }
# TDX/dstack: dstack's own guest-agent client, plus real DCAP cert-chain
# verification against Intel's PCCS collateral (Phala Network, real network
# I/O for the collateral fetch only -- dcap_qvl::verify itself is pure).
dstack-sdk = { version = "0.1", optional = true }
hex = { version = "0.4", optional = true }
dcap-qvl = { version = "0.6", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[features]
# Both on by default -- one binary, backend chosen at runtime via --backend,
# never a compile-time choice (see main.rs's own doc comment). Still real
# Cargo features, not unconditional deps, so `tee-adapter` (or anyone else
# embedding just the verification logic) can opt into only the backend it
# actually needs.
default = ["nitro", "dstack"]
nitro = ["dep:attestation-doc-validation", "dep:aws-nitro-enclaves-nsm-api"]
dstack = ["dep:dstack-sdk", "dep:hex", "dep:dcap-qvl"]

# Reproducible-build settings (TODO.md item #15's recipe, applied here too).
# Cargo only honors [profile.*] from the WORKSPACE ROOT manifest, so while
# this crate lives inside the main velocity workspace these are silently
# ignored there (the root's own identical settings apply instead) -- they
# exist here so the SAME settings take effect once this manifest becomes its
# own workspace root, i.e. the moment this directory is extracted/published
# standalone. `strip = true` removes debug info (the biggest realistic
# source of embedded absolute paths); `codegen-units = 1` removes
# cross-codegen-unit ordering as a nondeterminism source.
[profile.release]
strip = true
codegen-units = 1
